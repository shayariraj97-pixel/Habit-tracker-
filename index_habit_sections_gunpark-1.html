<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>JEE 2028 Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Caveat:wght@600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4ff;--bg2:#dbe8ff;--card:#fff;--ink:#0d1b4c;--mut:#6b7aa8;--acc:#2563eb;--ok:#16a34a;--bad:#ef4444;--line:#dbe6fb;--alt:#f4f8ff;--sh:0 8px 24px rgba(37,99,235,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070d1f;--bg2:#0f2257;--card:#121c38;--ink:#eaf0ff;--mut:#8fa0d0;--acc:#4f8cff;--ok:#34d399;--line:#24325c;--alt:#17234a;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#070d1f;--bg2:#0f2257;--card:#121c38;--ink:#eaf0ff;--mut:#8fa0d0;--acc:#4f8cff;--ok:#34d399;--line:#24325c;--alt:#17234a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(160deg,var(--bg2),var(--bg) 45%,var(--bg2)) fixed;background-size:100% 300%;animation:bgm 14s ease-in-out infinite alternate;color:var(--ink);font-family:'Sora',system-ui,sans-serif;font-size:15px;min-height:100vh}
#app{padding:18px 14px 110px;max-width:760px;margin:auto}
.an>*{animation:up .5s both}.an>*:nth-child(2){animation-delay:.07s}.an>*:nth-child(3){animation-delay:.14s}.an>*:nth-child(4){animation-delay:.21s}.an>*:nth-child(5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-1px;line-height:1.1}h2{font-size:17px;margin:0;font-weight:600}
.cur{font-family:'Caveat','Comic Sans MS',cursive;font-size:22px;color:var(--mut)}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}.mut{color:var(--mut);font-size:13px}
.pill{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:600}
.ring{transform:rotate(-90deg)}.ring circle{fill:none;stroke-linecap:round}.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc);stroke-dasharray:var(--c);transition:stroke-dashoffset .4s}
.an .ring .fg{animation:rg 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes rg{from{stroke-dashoffset:var(--c)}}
.rt{position:relative;display:grid;place-items:center}.rt b{position:absolute;font-size:26px;font-weight:800}
.ln{fill:none;stroke:var(--ok);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.an .ln{stroke-dasharray:1;animation:dr 1.4s ease both}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.an .ar{animation:fd 1.4s both}@keyframes fd{from{opacity:0}}
.sg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:16px;margin:10px 0;box-shadow:var(--sh)}
.sg button{flex:1;border:0;background:none;color:var(--mut);font:600 14px 'Sora',sans-serif;padding:10px 4px;border-radius:12px;transition:.25s}
.sg button.a{background:var(--acc);color:#fff;transform:scale(1.02)}
.sub{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}.sc{flex:1;min-width:130px;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);border:0;color:var(--ink);text-align:left;font-family:inherit}
.sc:active{transform:scale(.96)}.sc b{font-size:22px;display:block;margin-top:6px}
.pb{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),#22d3ee);width:var(--w);transition:width .4s}.an .pb i{animation:gw 1.1s both}@keyframes gw{from{width:0}}
.hr{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
/* Gentle category accents: visible but intentionally low-contrast. */
.habit-icon{width:24px;height:24px;object-fit:contain;vertical-align:middle;display:inline-block}
.hw .hr{background:color-mix(in srgb,var(--hc) 6%,transparent);border-left:2px solid color-mix(in srgb,var(--hc) 34%,transparent);padding-left:8px;border-radius:9px}
.hw .ck.k{background:var(--hc);border-color:var(--hc);color:#fff}
.habit-grid-row td.n{background:color-mix(in srgb,var(--hc) 7%,var(--card))}
.habit-grid-row .t.k:after{background:var(--hc);border-color:var(--hc);color:#fff}
.habit-grid-row .t:focus-visible{outline:2px solid color-mix(in srgb,var(--hc) 55%,transparent);outline-offset:-3px}.hr:last-child{border:0}.hr span{flex:1;font-size:15px}.hr em{font-style:normal;font-size:22px}
.ck{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:none;color:transparent;font-size:20px;transition:.2s}.ck.k{background:var(--ok);border-color:var(--ok);color:#fff}
.pop{animation:pp .45s}@keyframes pp{40%{transform:scale(1.35) rotate(-6deg)}}
.chips{display:flex;gap:8px}.chips button{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ink);font:600 15px 'Sora',sans-serif}.chips button.k{background:var(--acc);border-color:var(--acc);color:#fff}
.w{overflow:auto;border-radius:18px;background:var(--card);max-height:66vh;box-shadow:var(--sh);margin:10px 0}
table{border-collapse:separate;border-spacing:0;min-width:100%}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
th{position:sticky;top:0;z-index:2;font-weight:600;font-size:11px;padding:7px 4px;min-width:64px;color:var(--ink)}th.n{left:0;z-index:3;min-width:150px;background:var(--bg2);color:var(--ink)}
td.n{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding:8px;min-width:150px;max-width:150px;font-size:13px;font-weight:600;border-right:2px solid var(--line)}
tr:nth-child(even) td{background:var(--alt)}.hd th{min-width:40px}.hd td.n{min-width:130px;max-width:130px}
.t{width:100%;height:42px;border:0;background:none}.t:after{content:"";display:inline-block;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;vertical-align:middle;transition:.2s}
.t.k:after{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px;line-height:19px}.hd .t{width:40px;height:38px}
.p{display:inline-block;min-width:26px;border-radius:9px;padding:2px 8px;color:#222;font-size:12px;font-weight:600}.A{background:#f9a0a0}.B{background:#fcd668}.C{background:#9bdc8e}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>div{background:var(--alt);border-radius:16px;padding:12px;text-align:center}.g2 b{display:block;font-size:26px;font-weight:800;color:var(--acc)}
.tc{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.tc b{color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px}.bars i{flex:1;border-radius:4px 4px 0 0;background:var(--line);transform-origin:bottom}.an .bars i{animation:gr .7s both}@keyframes gr{from{transform:scaleY(0)}}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:736px;margin:auto;display:flex;background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;z-index:9}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px 'Sora',sans-serif;padding:8px 0;border-radius:18px;transition:.25s}.nav button em{display:block;font-style:normal;font-size:21px;transition:.25s}
.nav button.a{color:var(--acc);background:var(--alt)}.nav button.a em{transform:translateY(-2px) scale(1.2)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:20px;font-weight:600;z-index:20;animation:ts 2.2s both}@keyframes ts{0%{opacity:0;top:-40px}12%,80%{opacity:1}100%{opacity:0}}
.mo input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px}
.rs{display:block;margin:10px auto;border:0;background:none;color:var(--mut);font:inherit;text-decoration:underline;font-size:13px}
@keyframes bgm{to{background-position:0 100%}}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(var(--acc),transparent 70%);opacity:.2;animation:fl 9s ease-in-out infinite alternate}
body:before{width:280px;height:280px;top:-70px;right:-70px}body:after{width:220px;height:220px;bottom:90px;left:-80px;animation-delay:-4s;background:radial-gradient(var(--ok),transparent 70%)}
@keyframes fl{to{transform:translate(-30px,40px) scale(1.2)}}
.mq{background:linear-gradient(120deg,var(--acc),#7c3aed,#06b6d4,var(--acc));background-size:300% 100%;animation:sh 8s linear infinite;color:#fff}
@keyframes sh{to{background-position:300% 0}}
#mq{font-family:'Caveat','Comic Sans MS',cursive;font-size:27px;line-height:1.2;margin-top:6px;min-height:66px;transition:opacity .5s}
.fl{display:inline-block;animation:fire 1s ease-in-out infinite alternate}@keyframes fire{to{transform:scale(1.35) rotate(8deg)}}
.pb i{position:relative;overflow:hidden}.pb i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sn 2.4s infinite}@keyframes sn{to{transform:translateX(100%)}}
.rt svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 55%,transparent));animation:bt 3s ease-in-out infinite}@keyframes bt{50%{transform:rotate(-90deg) scale(1.04)}}
.card:active{transform:scale(.985)}.card{transition:transform .2s}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;border-radius:2px;animation:cf 2.2s ease-in forwards;pointer-events:none}@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}

.qc{position:relative;padding:0;overflow:hidden;min-height:290px;background:#000;cursor:pointer;user-select:none}
.qin{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 22px 38px;animation:qf .7s both;transition:opacity .35s,transform .35s}
.qin.out{opacity:0;transform:scale(.97)}
@keyframes qf{from{opacity:0;transform:scale(1.04) translateY(10px);filter:blur(5px)}}
.qtx{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:30px;line-height:1.2;color:#fff;position:relative;z-index:2;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.qau{margin-top:14px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:21px;color:#ffd23f;letter-spacing:1px;position:relative;z-index:2;text-shadow:0 0 14px rgba(255,210,63,.45)}
.qdots{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:5px;justify-content:center;z-index:5;pointer-events:none}
.qdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);transition:.3s}.qdots i.a{width:18px;border-radius:6px;background:#fff}
.qbar{position:absolute;left:0;right:0;top:0;height:3px;z-index:6;background:rgba(255,255,255,.12)}.qbar i{display:block;height:100%;background:#fff;opacity:.85;animation:qb 8s linear both}@keyframes qb{from{width:0}to{width:100%}}
.qlab{position:absolute;top:12px;left:16px;z-index:6;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.7);font-weight:600}
.q-hero{background:radial-gradient(circle at 50% 22%,rgba(255,190,80,.38),transparent 46%),linear-gradient(180deg,#0b1a24,#0e2a35 62%,#07121a)}
.q-hero .r{color:#ff2d55;text-shadow:0 0 16px rgba(255,45,85,.7)}
.q-paper{background:radial-gradient(circle at 30% 20%,#cfcac3,#aaa59e 80%);}
.q-paper .qtx{color:#161616;text-shadow:none;font-size:27px;line-height:1.7}.q-paper .qau{color:#222;text-shadow:none}
.q-paper .hl{background:#c9e51a;padding:3px 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.q-paper .qlab{color:rgba(0,0,0,.5)}.q-paper .qdots i{background:rgba(0,0,0,.25)}.q-paper .qdots i.a{background:#161616}.q-paper .qbar i{background:#161616}.q-paper .qbar{background:rgba(0,0,0,.1)}
.q-ravan{background:radial-gradient(circle at 50% 30%,#8a3118,#2d0e08 68%,#120504)}
.q-ravan .qtx{font-family:'Sora',sans-serif;font-weight:600;font-size:21px;line-height:1.4}.q-ravan .qau{font-family:'Sora',sans-serif;font-size:14px;color:#d4a84b;text-shadow:none}
.q-bat{background:radial-gradient(circle at 70% 25%,rgba(180,210,225,.22),transparent 50%),linear-gradient(180deg,#3d4b50,#161e22 70%,#0a0f12)}
.q-bat .qtx{font-family:'Sora',sans-serif;font-weight:400;font-size:27px;line-height:1.35}.q-bat .qau{font-family:'Sora',sans-serif;font-size:13px;color:#cfd8dc;text-shadow:none;letter-spacing:.5px}
.q-mono{background:radial-gradient(circle at 50% 18%,#2a2a2e,#0c0c0e 70%)}
.q-mono .qtx{font-family:'Sora',sans-serif;font-weight:400;font-size:26px;line-height:1.4}.q-mono .qtx b{font-weight:800}
.q-pain{background:radial-gradient(circle at 50% 100%,#58585c,#26262a 60%,#101012)}
.q-pain .qtx{font-weight:600;font-size:29px}
.q-fog{background:linear-gradient(180deg,#14161a,#25282d 55%,#3a3d42 85%,#15171a)}
.q-fog .qtx{font-family:'Sora',sans-serif;font-weight:400;font-size:25px}
.q-shiva{background:radial-gradient(circle at 80% 14%,#dfe8ee 0 2%,transparent 2.4%),linear-gradient(180deg,#31434d,#16232b 55%,#0a1117)}
.q-shiva .qtx{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;line-height:1.35}.q-shiva .qau{color:#e9e2d0;font-size:18px;text-shadow:none}
.q-manga{background:linear-gradient(115deg,#fff 0 46%,#ffd9d0 46% 62%,#f0705a 62% 70%,#fff 70%)}
.q-manga .qtx{font-family:'Sora',sans-serif;font-weight:800;font-size:23px;text-transform:uppercase;letter-spacing:.5px;text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.q-manga .qau{font-family:'Sora',sans-serif;font-weight:800;color:#fff;text-shadow:2px 2px 0 #000;font-size:18px}
.q-manga .qdots i{background:rgba(0,0,0,.3)}.q-manga .qdots i.a{background:#000}.q-manga .qbar i{background:#000}.q-manga .qlab{color:#000}
.q-stoic{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 40%),linear-gradient(180deg,#7fb0d0,#4a769a 55%,#2c4a60)}
.q-stoic .qtx{font-family:'Sora',sans-serif;font-weight:600;font-size:23px}.q-stoic .qau{font-family:'Sora',sans-serif;font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.q-prime{background:radial-gradient(circle at 50% 35%,#4a4944,#1c1c1d 65%,#0a0a0b)}
.q-prime .qtx{font-size:26px;font-weight:600}.q-prime .r{color:#ff3b30;font-size:34px;text-shadow:0 0 18px rgba(255,59,48,.55)}
.q-ego{background:radial-gradient(circle at 60% 30%,#3a3a3d,#0d0d0f 70%);align-items:stretch;justify-content:space-between;text-align:left}
.q-ego:before{content:"";position:absolute;right:-60px;top:-50px;width:230px;height:230px;border-radius:50%;background:radial-gradient(#6a6a70,transparent 70%);opacity:.35}
.q-ego .e1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:32px;color:#eee;align-self:flex-end;margin-top:20px;position:relative}
.q-ego .e2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:20px;color:#bbb;margin-bottom:6px;position:relative}
/* date numbers (month grid header): logo cyan */
:root{--dt:#0a8f86}
@media (prefers-color-scheme:dark){:root{--dt:#27e6d4}}
:root[data-theme="dark"]{--dt:#27e6d4}
:root[data-theme="light"]{--dt:#0a8f86}
.hd th:not(.n){color:var(--dt);background:var(--card);font-size:12px;font-weight:700}
.mo input{color:var(--dt)}

/* ===== BLACK + SOFT (neumorphic) THEME ===== */
:root:root:root{--bg:#0a0b0f;--bg2:#0a0b0f;--card:#0f1116;--ink:#e8ebf4;--mut:#8b91a8;--acc:#3fb6ff;--ok:#34d399;--bad:#ff5a6e;--line:#1b1e29;--alt:#12141b;--dt:#27e6d4;--sh:7px 7px 16px #040508,-5px -5px 14px #1a1d28;--shi:inset 4px 4px 9px #040508,inset -3px -3px 8px #1a1d28;color-scheme:dark}
html,body{background:#0a0b0f!important}
body{animation:none!important}body:before,body:after{display:none!important}
.card,.sc,.sg,.w,.qc{background:var(--card);box-shadow:var(--sh)}
.qc{background:#000}
.sg button.a{background:var(--card);box-shadow:var(--shi);color:var(--ink);transform:none}
.sc{border:0}.sc:active,.card:active{transform:none}
.nav{background:var(--card);box-shadow:8px 8px 20px #040508,-4px -4px 14px #181b26,0 0 0 1px #151822}
.nav button.a{background:var(--card);box-shadow:var(--shi);color:var(--acc)}
.pb{background:#0a0b0f;box-shadow:var(--shi);height:10px}.pb i{box-shadow:0 0 8px rgba(63,182,255,.45)}
.ring .bg{stroke:#12141b}
.ck{border:0;background:var(--card);box-shadow:var(--sh);border-radius:14px}
.ck.k{background:var(--card);box-shadow:var(--shi);color:var(--ok);border:0}
.chips button{background:var(--card);border:0;box-shadow:var(--sh);color:var(--ink)}
.chips button.k{background:var(--card);box-shadow:var(--shi);color:var(--acc)}
.t:after{border:0;background:var(--card);box-shadow:var(--shi);border-radius:8px}
.t.k:after{background:var(--card);color:var(--ok);box-shadow:var(--shi)}
th,td{border-color:var(--line)}th{background:var(--card);color:var(--ink)}
th.n,td.n{background:var(--card)}tr:nth-child(even) td{background:var(--alt)}
.mo input{background:var(--card);border:0;box-shadow:var(--shi);color:var(--dt)}
.g2>div{background:var(--card);box-shadow:var(--shi)}
.bars i{background:#1b1e29}.pill{background:rgba(52,211,153,.12)}
.hw{border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.hw:last-child{border:0}.hw .hr{border:0}
.hr.hp{cursor:pointer}.pp{color:var(--acc);font-size:11px;margin-left:4px;font-weight:600}
.pts{display:flex;gap:8px;flex-wrap:wrap;padding:2px 4px 14px 38px;animation:up .3s both}
.pt{flex:1;min-width:92px;border:0;border-radius:12px;background:var(--card);box-shadow:var(--sh);color:var(--mut);font:600 12px 'Sora',sans-serif;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:6px}
.pt b{color:transparent;font-size:14px}.pt.k{box-shadow:var(--shi);color:var(--ink)}.pt.k b{color:var(--ok)}
.add{display:block;width:100%;margin:14px 0 4px;padding:16px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--sh);color:var(--acc);font:700 15px 'Sora',sans-serif}.add:active{box-shadow:var(--shi)}
#sh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}.shb{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.shc{position:relative;width:100%;max-width:520px;background:#0f1116;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .28s both}
.shc h2{margin:0 0 14px;font-size:18px}.sb{display:block;width:100%;margin:10px 0;padding:15px;border:0;border-radius:16px;background:#0f1116;box-shadow:var(--sh);color:var(--ink);font:700 15px 'Sora',sans-serif}
.sb:active{box-shadow:var(--shi)}.sb.dn{color:#ff6b7d}.sb.ok{color:var(--ok)}.sb.gh{color:var(--mut)}
.fr{display:flex;align-items:center;gap:10px;margin:8px 0}.fr label{width:96px;font-size:13px;color:var(--mut)}.fr input,.fr select{flex:1;min-width:0;padding:12px;border:0;border-radius:12px;background:#0a0b0f;box-shadow:var(--shi);color:var(--ink);font:600 15px 'Sora',sans-serif}

.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 0;color:var(--mut);font-size:13px}
.mnav button{border:0;background:var(--card);box-shadow:var(--sh);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:20px;line-height:1}.mnav button:active{box-shadow:var(--shi)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;background:#0f1116;box-shadow:var(--sh);color:var(--ink);font:700 15px 'Sora',sans-serif;padding:16px 8px}.cat:active{box-shadow:var(--shi)}.cat i{width:12px;height:12px;border-radius:50%}
.bdt{color:#ff4d5e;font-size:10px;font-weight:800;letter-spacing:.5px;margin-left:4px}
.hw.bad .hr{background:color-mix(in srgb,#ff4d5e 8%,transparent);border-left-color:rgba(255,77,94,.48)}
.hw[data-g="3"] .ck.k{background:#e11d48!important;border:1px solid #fb7185!important;color:#fff!important;opacity:1!important;text-shadow:0 1px 2px rgba(0,0,0,.28);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 3px 10px rgba(225,29,72,.22)!important}
.habit-grid-row[data-g="3"] .t.k:after{background:#e11d48!important;border:1px solid #fb7185!important;color:#fff!important;opacity:1!important;text-shadow:0 1px 2px rgba(0,0,0,.28)}
/* Study habit completion ticks: requested green, without changing the Study graph colour. */
.hw[data-g="0"] .ck.k{background:#16A34A!important;border-color:#16A34A!important;color:#fff!important;box-shadow:0 0 8px rgba(22,163,74,.16)}
.habit-grid-row[data-g="0"] .t.k:after{background:#16A34A!important;border-color:#16A34A!important;color:#fff!important;box-shadow:none!important}

/* Equal-weight section progress: each completed section fills the same share.
   Liquid-style fill rises from the bottom; the label remains legible above it. */
.ck.partial{position:relative;isolation:isolate;overflow:hidden;background:color-mix(in srgb,var(--hc) 7%,var(--card));border:1px solid color-mix(in srgb,var(--hc) 38%,var(--line));color:var(--ink);}
.ck.partial:before{content:"";position:absolute;z-index:-1;left:-8%;right:-8%;bottom:0;height:var(--prog);background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 74%,#fff 8%),var(--hc));border-radius:48% 52% 0 0 / 12% 14% 0 0;transition:height .55s cubic-bezier(.2,.75,.25,1);animation:waterWave 2.4s ease-in-out infinite alternate;}
.ck.partial{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.55);font-weight:800}
@keyframes waterWave{from{transform:translateY(2px) rotate(-1deg)}to{transform:translateY(-1px) rotate(1deg)}}
.hd .t.partial{position:relative;isolation:isolate;overflow:hidden;filter:none}
.hd .t.partial:before{content:"";position:absolute;z-index:0;left:4px;right:4px;bottom:7px;height:var(--prog);background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 76%,#fff 8%),var(--hc));border-radius:45% 55% 5px 5px / 18% 16% 5px 5px;transition:height .55s cubic-bezier(.2,.75,.25,1);animation:waterWave 2.4s ease-in-out infinite alternate;}
.hd .t.partial:after{content:attr(data-ratio);position:relative;z-index:1;width:29px;height:23px;border:1px solid color-mix(in srgb,var(--hc) 55%,var(--line));background:rgba(8,10,16,.22);box-shadow:var(--shi);border-radius:7px;color:#fff;font:700 9px 'Sora',sans-serif;line-height:21px;text-align:center;letter-spacing:-.3px;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.hd .t.partial:focus-visible{outline:2px solid color-mix(in srgb,var(--hc) 65%,transparent);outline-offset:-3px}
/* Gun Park quote: premium black / crimson manhwa-inspired typography */
.q-manga{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 82% 18%,rgba(220,25,45,.34),transparent 36%),linear-gradient(135deg,#08090c 0%,#17191f 52%,#08090c 100%);border:1px solid rgba(220,35,52,.28)}
.q-manga:before{content:'GUN PARK';position:absolute;right:-8px;bottom:30px;z-index:0;font:900 clamp(42px,10vw,78px)/.9 'Sora',sans-serif;letter-spacing:-4px;color:rgba(255,255,255,.045);white-space:nowrap;transform:skewY(-8deg)}
.q-manga:after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff334b,#8d101f);box-shadow:0 0 22px rgba(255,40,65,.45)}
.q-manga .qtx{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,5vw,31px);line-height:1.28;letter-spacing:-.8px;text-transform:uppercase;color:#f5f5f7;text-shadow:0 3px 18px rgba(0,0,0,.7);max-width:92%;}
.q-manga .gp-accent{color:#ff4358;text-shadow:0 0 18px rgba(255,40,65,.35)}
.q-manga .qau{font-family:'Sora',sans-serif;font-weight:800;font-size:12px;letter-spacing:4px;color:#e9e9ed;text-shadow:none;margin-top:18px;border-top:1px solid rgba(255,255,255,.17);padding-top:10px}
.q-manga .qlab{color:#ff7180;font-size:9px;letter-spacing:3.5px}
.q-manga .qdots i{background:rgba(255,255,255,.25)}.q-manga .qdots i.a{background:#ff4358}.q-manga .qbar{background:rgba(255,255,255,.12)}.q-manga .qbar i{background:#ff4358}
