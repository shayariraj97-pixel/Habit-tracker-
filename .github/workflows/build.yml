name: Build JEE Tracker APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tablet-friendly mode: if you uploaded project.zip, unpack it first
      - name: Unpack project.zip (if present)
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add widgets, icons and signing
        run: node scripts/patch-android.js

      - name: Make sure a signing key exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "No debug.keystore in repo - generating a temporary one"
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JEE-Tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-APK
          path: JEE-Tracker.apk

      - name: Publish to Releases (easy download on the tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JEE Tracker build ${{ github.run_number }}
          files: JEE-Tracker.apk
